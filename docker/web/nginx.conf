# GKMF - servidor web estático del prototipo (carpeta src/), solo para DESARROLLO.
# Imagen nginx-unprivileged: corre sin root, en el puerto 8080, y solo necesita escribir en /tmp.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index templates/index.html;

    # Política de seguridad de contenido: solo se ejecuta código propio (sin scripts ni estilos en línea; la fuente
    # también es propia). connect-src enumera las únicas direcciones de la API a las que puede llamar la interfaz:
    # si la API se despliega en otro origen, se cambia aquí y en <meta name="gkmf-api-base"> del HTML.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # En desarrollo no se guarda nada en caché para ver siempre los últimos cambios.
    add_header Cache-Control "no-cache" always;

    # Es un sitio de solo lectura: cualquier otro método se rechaza.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # No se sirven archivos ocultos (.git, .env...) ni los de pruebas que viven junto al código.
    location ~ /\. {
        return 404;
    }

    location ~ \.test\.mjs$ {
        return 404;
    }

    location = / {
        return 302 /templates/index.html;
    }

    location / {
        try_files $uri =404;
    }
}
